<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scent Finder</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>

  <header class="nav">
    <div class="nav__inner">
      <a class="nav__logo" href="/">
        <img src="/assets/logo.png" alt="Scent Finder">
        <span>Scent Finder</span>
      </a>
      <div class="nav__center" id="nav-state"></div>
      <nav class="nav__links"></nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero__deco" aria-hidden="true"></div>
    <div class="hero__inner">
      <p class="hero__eyebrow">향기 기반 제품 추천</p>
      <h1 class="hero__title">당신의 향을<br>발견하세요</h1>
      <p class="hero__desc">샴푸, 바디워시, 핸드크림, 향수 — 좋아하는 향으로 딱 맞는 제품을 찾아보세요</p>
      <div class="hero__chips">
        <span class="hero__chip">과일향</span>
        <span class="hero__chip">플로럴향</span>
        <span class="hero__chip">우디향</span>
        <span class="hero__chip">시트러스</span>
        <span class="hero__chip">머스크</span>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section__inner">
      <div class="section__head">
        <h2 class="section__title">카테고리</h2>
      </div>
      <div class="category-grid" id="product-container"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">
        <strong>Scent Finder</strong>
        <p>좋아하는 향으로 나에게 맞는 제품을 찾아보세요.</p>
      </div>
      <div class="site-footer__copy">&copy; 2026 Scent Finder</div>
    </div>
  </footer>

  <script src="/js/shared.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
