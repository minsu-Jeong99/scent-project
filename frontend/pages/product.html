<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제품 — Scent Finder</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>

  <header class="nav">
    <div class="nav__inner">
      <a class="nav__logo" href="/">
        <img src="/assets/logo.png" alt="Scent Finder">
        <span>Scent Finder</span>
      </a>
      <div class="nav__center" id="nav-state"></div>
      <nav class="nav__links" id="breadcrumb"></nav>
    </div>
  </header>

  <div class="page-header">
    <div class="page-header__inner">
      <p class="page-header__label">제품 카테고리</p>
      <h1 class="page-header__title" id="page-title"></h1>
    </div>
  </div>

  <section class="scent-section">
    <p class="scent-section__label">향 계열을 선택하세요</p>
    <div class="scent-grid" id="scents-container"></div>
  </section>

  <div class="toolbar">
    <span class="toolbar__info" id="shopping-title">전체 관련 상품</span>
    <button id="sort-button" class="btn-sort">가격 낮은순</button>
  </div>

  <div id="products-container" class="product-grid"></div>
  <div id="pagination" class="pagination"></div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__brand">
        <strong>Scent Finder</strong>
        <p>좋아하는 향으로 나에게 맞는 제품을 찾아보세요.</p>
      </div>
      <div class="site-footer__copy">&copy; 2026 Scent Finder</div>
    </div>
  </footer>

  <script src="/js/shared.js"></script>
  <script src="/js/product.js"></script>
  <script src="/js/navbar.js"></script>
</body>
</html>
